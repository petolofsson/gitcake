[package]
name = "git-task-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for git-task"

[[bin]]
name = "gt"
path = "src/main.rs"

[dependencies]
git-task-core = { path = "../core" }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
