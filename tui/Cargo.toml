[package]
name = "gitcake-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for gitcake"

[[bin]]
name = "gitcake"
path = "src/main.rs"

[dependencies]
gitcake-core = { path = "../core" }
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
