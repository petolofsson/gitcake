[package]
name = "git-task-core"
version = "0.1.0"
edition = "2021"
description = "Core library for git-task — task parsing, git operations, repo management"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gray_matter = "0.2"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
