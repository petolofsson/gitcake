name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release --target x86_64-unknown-linux-musl -p gitcake-tui -p gitcake-mcp

      - name: Package
        run: |
          cd target/x86_64-unknown-linux-musl/release
          strip gitcake gitcake-mcp
          tar czf gitcake-linux-x86_64.tar.gz gitcake gitcake-mcp

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-unknown-linux-musl/release/gitcake-linux-x86_64.tar.gz
