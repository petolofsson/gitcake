[package]
name = "gitcake-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for gitcake — exposes core as Model Context Protocol tools"

[[bin]]
name = "gitcake-mcp"
path = "src/main.rs"

[dependencies]
gitcake-core = { path = "../core" }
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
dirs = "5"
toml = "0.8"
